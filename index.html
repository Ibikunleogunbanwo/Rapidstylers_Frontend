<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9381FF" />
    <meta
      name="description"
      content="Find and book trusted beauty professionals near you, from barbers and stylists to nails and lashes."
    />
    <!-- Defaults for link previews. The build writes a copy of this shell for
         each fixed public page with that page's own tags (src/seo/pageMeta.mjs),
         and link-preview bots get profile and blog-post tags from
         api/link-preview.mjs. In the browser the SEO component swaps the
         canonical and og:url for the page being viewed, and published page SEO
         overrides the title, description and image where an admin has set them. -->
    <link rel="canonical" href="https://www.rapidstylers.ca/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RapidStylers" />
    <meta property="og:title" content="RapidStylers" />
    <meta
      property="og:description"
      content="Find and book trusted beauty professionals near you, from barbers and stylists to nails and lashes."
    />
    <meta property="og:url" content="https://www.rapidstylers.ca/" />
    <meta property="og:image" content="https://www.rapidstylers.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RapidStylers: book trusted beauty professionals near you" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RapidStylers" />
    <meta
      name="twitter:description"
      content="Find and book trusted beauty professionals near you, from barbers and stylists to nails and lashes."
    />
    <meta name="twitter:image" content="https://www.rapidstylers.ca/og-image.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. Files in public/ are served from the root,
      so they are referenced with a leading slash.
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>RapidStylers</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
