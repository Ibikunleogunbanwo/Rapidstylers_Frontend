# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Frontend dependencies (React / CRA toolchain). Weekly cadence keeps the PR
  # queue small; the eventual CRA -> Vite migration is its own tracked effort.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    # React 19 cannot land as a lone major bump (react-dom 19 peers react ^19;
    # MUI 5 peers react-dom ^17||^18). Suppressed until the coordinated migration
    # tracked in https://github.com/Ibikunleogunbanwo/Rapidstylers_Frontend/issues/20
    # lands; minors/patches inside 18.x still flow normally.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflows (branch-sync, chunk-integrity, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
